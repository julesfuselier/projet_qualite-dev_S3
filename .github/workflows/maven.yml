name: Java CI with Maven

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  build:
    permissions:
      checks: write
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # Étape 1 : Build et Exécution des Tests
      - name: Build and Run Tests with Maven
        # La commande 'package' exécute automatiquement les phases compile, test, et package.
        run: mvn -B package --file pom.xml

  # Linter
  lint:
    name: Super-Linter
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          # Nécessaire pour Super-Linter
          fetch-depth: 0

      - name: Run Super-Linter
        uses: github/super-linter@v5 # Utilisez la dernière version stable
        env:
          # Activation des linters spécifiques
          DEFAULT_BRANCH: main
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Activez les linters que vous voulez (ici, uniquement Java, Maven, et YAML)
          VALIDATE_JAVA: true
          VALIDATE_MAVEN: true
          VALIDATE_YAML: true
          # Vous pouvez aussi DÉSACTIVER ceux que vous ne voulez pas, par exemple :
          # VALIDATE_ALL_CODEBASE: false